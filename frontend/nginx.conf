# Serves the built SPA and proxies the API to the backend container.
#
# Proxying here rather than pointing the browser at the backend keeps the
# app same-origin in production exactly as the Vite dev proxy does in
# development, so CORS is not load-bearing in either environment.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames are immutable; index.html must never be cached or a
    # deploy leaves clients on the old bundle indefinitely.
    # One directive, not `expires` plus `add_header`: those emit two
    # Cache-Control headers, and which one a cache honours is up to the
    # cache. Vite fingerprints these filenames, so they are immutable.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A cold search fans out to three external APIs and then summarizes;
        # nginx's 60s default would cut off a legitimately slow request.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;
    }

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # SPA fallback: the app has no client-side router today, but a deep
    # link should still land on the app rather than a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
