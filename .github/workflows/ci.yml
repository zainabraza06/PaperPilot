# CI for PaperPilot.
#
# Runs what a reviewer would run, and one thing they could not: that the
# frontend's types still describe the backend's Python models. See the
# `schema` steps below — the two halves of that chain live in different
# jobs on purpose.
#
# Deliberately *not* here: the Playwright harness. It drives the real app
# against PubMed, arXiv and Crossref, so it needs outbound network to three
# services that rate-limit by IP — arXiv blocks shared addresses, and a
# CI runner is the most shared address there is. A suite that fails for
# reasons unrelated to the change teaches people to ignore it. It stays a
# local command (`npm run verify`), and that limitation is stated in the
# README rather than hidden behind a badge.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A force-push or a quick follow-up commit should cancel the run it
# supersedes rather than queue behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend · ruff, mypy, pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # CPU-only torch, from PyTorch's own index, before anything else.
      # The default PyPI wheel for linux-x86_64 carries CUDA libraries
      # worth roughly 2 GB that nothing here touches; installing it first
      # means the resolver never considers the CUDA build when
      # sentence-transformers asks for torch.
      - name: Install CPU-only torch
        working-directory: backend
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: python -m ruff check .

      - name: Type-check
        working-directory: backend
        run: python -m mypy app scripts

      # No model download: the suite is offline and deterministic by
      # design, and the one test that touches the embedder asserts it
      # defers loading rather than performing it.
      - name: Test
        working-directory: backend
        run: python -m pytest -q

      # Half of the type chain: the committed schema must still describe
      # the Python models. `dump_openapi` reads the app without starting a
      # server, so this costs nothing.
      - name: Schema is current
        working-directory: backend
        run: |
          python -m scripts.dump_openapi
          git diff --exit-code --stat ../frontend/openapi.json \
            || { echo "::error::frontend/openapi.json is stale. Run: cd backend && python -m scripts.dump_openapi"; exit 1; }

  frontend:
    name: frontend · types, lint, contrast, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The other half of the type chain: the generated types must match
      # the committed schema. With the backend job's check, the two
      # together prove src/types/api.ts reflects the Pydantic models —
      # which is the whole reason those types are generated and not
      # written by hand.
      - name: Types match the schema
        working-directory: frontend
        run: |
          npx openapi-typescript openapi.json -o src/types/api.ts
          git diff --exit-code --stat src/types/api.ts \
            || { echo "::error::src/types/api.ts is stale. Run: npx openapi-typescript openapi.json -o src/types/api.ts"; exit 1; }

      # Runs before the build for the same reason it gates `npm run build`
      # locally: a palette that fails WCAG should stop the pipeline, not
      # produce a bundle nobody checked.
      - name: Contrast audit
        working-directory: frontend
        run: npm run contrast

      - name: Type-check
        working-directory: frontend
        run: npx tsc -b

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npx vite build
